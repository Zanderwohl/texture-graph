[package]
name = "texture-graph-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "texture-graph"
path = "src/main.rs"

[dependencies]
texture-graph-core = { path = "../core" }
texture-graph-gpu = { path = "../gpu" }
eframe = { version = "0.35", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.35"
egui-wgpu = "0.35"
wgpu.workspace = true
glam.workspace = true
palette.workspace = true
serde.workspace = true
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
pollster = "0.4"
# `texture-graph screenshot`.
png = "0.18"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"
console_log = "1"
rfd = { version = "0.17", default-features = false }
