[package]
name = "texture-graph-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Without `default-features = false` every consumer of this crate gets
# `std-fs` switched on, and a wasm host loses the compile error it is for.
texture-graph-core = { path = "../core", default-features = false }
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
log = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# Only the test modules block on `DeviceCtx::request_headless`; a consumer
# drives that future with its own executor.
pollster = "0.4"
# `examples/bake.rs` loads a graph from disk.
texture-graph-core = { path = "../core", features = ["std-fs"] }
