[package]
name = "texture-graph-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["std-fs"]
# `load_from_path` / `save_to_path`. Turn off for wasm: `std::fs` compiles for
# `wasm32-unknown-unknown` but fails at runtime, so a compile error is better.
std-fs = []

[dependencies]
palette.workspace = true
serde.workspace = true
ron.workspace = true
thiserror.workspace = true
