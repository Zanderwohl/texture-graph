[workspace]
resolver = "2"
members = ["crates/core", "crates/gpu", "crates/ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
palette = { version = "0.7", features = ["serializing"] }
noise = "0.9"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
thiserror = "1"
